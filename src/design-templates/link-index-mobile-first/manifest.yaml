version: 1
template_id: link-index-mobile-first
status: active
content_source: src/data/site.json
active_template_config: src/data/active-template.json
design_control_config: src/data/design-control.json
control_map: src/design-templates/link-index-mobile-first/control-map.json
runtime_files:
  - src/design-templates/link-index-mobile-first/index.astro
  - src/design-templates/link-index-mobile-first/styles.css
  - src/design-templates/link-index-mobile-first/tokens.css
control_files:
  - src/data/design-control.json
  - src/design-templates/link-index-mobile-first/control-map.json
quality_gates:
  - npm_build
  - mobile_screenshot
  - desktop_screenshot
  - route_health_check
  - no_text_overflow
  - section_header_alignment_review
  - keyboard_focus_visible
  - privacy_behavior_unchanged
content_contract:
  shared_source: src/data/site.json
  universal_modules:
    - identity
    - work
    - contact
    - social
  optional_modules:
    - garden
    - lifestyle
    - proof_grid
    - offers
brand_contract:
  root_role: public_front_door
  trust_signal: normal_organized_competent_personal
  operating_rule: show_and_do_do_not_explain
  avoid:
    - pitch_deck_copy
    - tech_stack_personality
    - generic_saas_hero
    - overexplaining
notes:
  - "This template preserves the accepted JNAP mobile-first link hub design."
  - "Switching templates must not change shared content, route URLs, or privacy decisions."
